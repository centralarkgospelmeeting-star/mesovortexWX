name: Repair paths and build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.repair.outputs.commit }}
    steps:
      - name: Repair malformed filenames when present
        id: repair
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir repo
          cd repo
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin refs/heads/main
          parent="$(git rev-parse FETCH_HEAD)"
          git read-tree "$parent"

          python3 - <<'PY'
          import subprocess

          output = subprocess.check_output([b"git", b"ls-files", b"-z"])
          paths = output.split(b"\0")[:-1]
          odd = [path for path in paths if b"\n" in path or b"\r" in path]
          targets = [
              path for path in odd
              if path.startswith(b"app/globals.css\n@tailwind base;")
              and b"@tailwind utilities;" in path
          ]

          if b"app/globals.css" not in paths:
              raise SystemExit("Safety check failed: the real app/globals.css is missing.")
          if odd and (len(targets) != 2 or set(targets) != set(odd)):
              print("Unexpected newline-containing paths:")
              for path in odd:
                  print(repr(path))
              raise SystemExit("Safety check failed; no repository files were changed.")

          for path in targets:
              print("Removing malformed path:", repr(path))
              subprocess.run([b"git", b"update-index", b"--force-remove", b"--", path], check=True)
          if not targets:
              print("No malformed paths remain; proceeding with build.")
          PY

          tree="$(git write-tree)"
          commit="$(git -c user.name='GitHub Actions' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$parent" -m 'Remove malformed globals.css paths when present')"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" push origin "${commit}:refs/heads/main"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

  build:
    needs: repair
    runs-on: windows-latest
    steps:
      - name: Check out repaired source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair.outputs.commit }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:windows

      - name: Publish installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mesovortexwx-desktop-${{ github.run_id }}
          name: MesoVortexWX Windows installer ${{ github.run_number }}
          target_commitish: ${{ needs.repair.outputs.commit }}
          files: dist/MesoVortexWX-Setup.exe
